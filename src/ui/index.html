<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delve — The Hold</title>
<style>/*FONTS*/
/*CSS*/</style>
</head>
<body>
<main id="app">
  <section id="board">
    <svg id="map" role="img" aria-label="Map of the hold"></svg>
    <div id="map-tools">
      <button data-do="zoomIn" title="Zoom in">+</button>
      <button data-do="zoomOut" title="Zoom out">−</button>
      <button data-do="home" title="Back to the hold">⌂</button>
    </div>
    <div id="info" hidden></div>
  </section>
  <aside id="side">
    <header>
      <h1>Delve</h1>
      <p class="sub">A Solo Map-Drawing Game · by Anna Blackwell</p>
      <p class="version">Family edition · version /*VERSION*/</p>
    </header>
    <div id="status"></div>
    <ol id="tracker"></ol>
    <div id="phase" class="panel"></div>
    <div class="panel">
      <h3>The last card</h3>
      <div id="card"></div>
    </div>
    <div class="panel">
      <h3>Dwarves of the hold</h3>
      <ul id="units"></ul>
    </div>
    <div class="panel chronicle-panel">
      <h3>Chronicle <button class="small" data-do="exportChronicle">Export .txt</button></h3>
      <ol id="chronicle"></ol>
    </div>
    <footer>
      <button id="undo" data-do="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button data-do="exportSave">Save file</button>
      <button data-do="importSave">Load file</button>
      <button data-do="scores">Records</button>
      <button data-do="help">Help</button>
      <button data-do="newGame">New hold</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </footer>
  </aside>
</main>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<script>/*JS*/</script>
</body>
</html>
